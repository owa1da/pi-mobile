name: CI

on:
  push:
    branches: [main, pi-mobile]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build highlight package
        run: npm run build:highlight

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test --workspace=@pi-mobile/app

      - name: Highlight tests
        run: npx vitest run --root packages/highlight
