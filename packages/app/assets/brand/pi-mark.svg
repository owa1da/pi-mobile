<!--
  Pi mark: the pi agent logo (the block "P" Paseo shipped, upstream components/icons/pi-icon.tsx,
  viewBox 100 100 600 600), redrawn on a 100×100 grid as five rects of a 4×4 grid of 16-unit cells
  starting at 18:
    ###.
    #.#.
    ##.#
    #..#
  Source of every app icon, splash, notification icon and favicon, and of PiIcon
  (src/components/icons/pi-mark-shapes.ts mirrors it; a unit test keeps them equal). Regenerate the
  PNGs with `node scripts/build-brand-assets.mjs`. Only <rect> and <polygon> are read.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="#000000" data-role="background" />
  <g fill="#7ccba0" data-role="glyph">
    <rect x="18" y="18" width="48" height="16" rx="0" />
    <rect x="18" y="34" width="16" height="48" rx="0" />
    <rect x="50" y="34" width="16" height="16" rx="0" />
    <rect x="34" y="50" width="16" height="16" rx="0" />
    <rect x="66" y="50" width="16" height="32" rx="0" />
  </g>
</svg>
